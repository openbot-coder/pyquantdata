# 推 tag (v*) → 测试 → 构建 → Trusted Publishing (OIDC) 免密钥发布 PyPI。
# 依赖：GitHub 侧 Environment `pypi` + PyPI 侧 pending publisher（owner/openbot-coder、
# 仓库 pyquantdata、workflow release.yml、environment pypi）。
# refs 均经 raw.githubusercontent.com 核验存在（2026-09-24）。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      # 防「tag 叫 v0.1.0、pyproject 里还是 0.0.9」的错发
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv version --short)"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::tag v${tag_version} 与 pyproject 版本 ${pkg_version} 不一致"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyquantdata
    permissions:
      id-token: write # Trusted Publishing 必需（OIDC 换 15 分钟短期令牌），无需任何密钥
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
